#cloud-config

users:
  - name: student
    groups: sudo
    shell: /bin/bash
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    ssh_authorized_keys:
      - ${SSH_KEY}

package_update: true

packages:
  - nginx

runcmd:
  - sed -i 's/listen 80 default_server;/listen ${APP_PORT} default_server;/' /etc/nginx/sites-available/default
  - sed -i 's/listen \[::\]:80 default_server;/listen [::]:${APP_PORT} default_server;/' /etc/nginx/sites-available/default

  - bash -c 'echo "${GREETING} on $(hostname)" > /var/www/html/index.nginx-debian.html'

  - nginx -t
  - systemctl restart nginx

  - mkdir -p /mnt/data
  - bash -c 'if [ -b /dev/disk/by-id/virtio-data ]; then mkfs.ext4 /dev/disk/by-id/virtio-data; else echo "диск не найден, пропускаю разметку"; fi'
  - bash -c 'if [ -b /dev/disk/by-id/virtio-data ]; then echo "/dev/disk/by-id/virtio-data  /mnt/data  ext4  defaults,nofail  0  2" >> /etc/fstab; else echo "диск не найден, пропускаю запись в fstab"; fi'
  - mount -a